<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>360° Car Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0f;--bg2:#121419;--card:#16181e;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--text:#eef0f4;--muted:#98a0ad;--accent:#4fd1c5;--accent-d:#06221f;--ok:#48bb78;--warn:#f6ad55;--bad:#f56565;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter','IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html[lang=ar] body{font-family:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif}
body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;background:rgba(255,255,255,.07);font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.pri{background:var(--accent);color:var(--accent-d)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.wa{background:#25d366;color:#05210f}
.btn.danger{color:#feb2b2}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.inp{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line2);background:rgba(0,0,0,.25);outline:none;transition:.15s}
.inp:focus{border-color:var(--accent)}
select.inp option{background:#15171c}
textarea.inp{resize:vertical;min-height:80px;line-height:1.7}
label.f{display:block;font-size:12px;color:var(--muted)}
label.f .inp{margin-top:5px}
.note{font-size:12.5px;color:var(--muted);line-height:1.75}
/* header */
#hdr{position:fixed;top:0;inset-inline:0;height:62px;display:flex;align-items:center;gap:12px;padding:0 18px;z-index:20;background:rgba(11,12,15,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#brand{display:flex;align-items:center;gap:10px;line-height:1.2;min-width:0}
#brand .logo{width:36px;height:36px;border-radius:11px;background:conic-gradient(from 200deg,var(--accent),#3182ce,var(--accent));display:grid;place-items:center;color:#05141a;font-weight:700;font-size:13px;flex:none}
#brand b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#brand small{font-size:11.5px;color:var(--muted)}
.hact{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
#lang{width:auto;padding:8px 10px;border-radius:10px;font-size:13px;background:rgba(255,255,255,.06);border-color:var(--line)}
#banner{position:fixed;top:62px;inset-inline:0;z-index:19;padding:8px 18px;font-size:13px;background:rgba(246,173,85,.12);color:#fbd38d;border-bottom:1px solid rgba(246,173,85,.2);text-align:center}
.view{position:fixed;top:62px;inset-inline:0;bottom:0}
body.hasBanner .view{top:96px}
/* home */
#home{overflow:auto}
.hero{max-width:1180px;margin:0 auto;padding:36px 20px 10px}
.hero h1{font-size:clamp(22px,3.4vw,34px);font-weight:700;letter-spacing:-.3px}
.hero p{color:var(--muted);margin-top:8px;font-size:15px;max-width:640px;line-height:1.8}
.hbar{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.hbar .inp{max-width:380px}
.grid{max-width:1180px;margin:0 auto;padding:16px 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.2s;display:flex;flex-direction:column;text-align:start}
.ccard:hover{transform:translateY(-3px);border-color:var(--line2)}
.ccard .cv{aspect-ratio:16/10;background:#0f1115 center/cover no-repeat;position:relative}
.ccard .cv .badges{position:absolute;top:10px;inset-inline-start:10px;display:flex;gap:6px;flex-wrap:wrap}
.bdg{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.65);backdrop-filter:blur(6px)}
.bdg.acc{background:var(--accent);color:var(--accent-d)}
.bdg.s-reserved{background:var(--warn);color:#2a1800}
.bdg.s-sold{background:var(--bad);color:#2a0606}
.bdg.demo{background:#805ad5;color:#fff}
.ccard .cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.ccard h3{font-size:15.5px;font-weight:600}
.ccard .meta{font-size:12.5px;color:var(--muted)}
.ccard .pr{font-size:17px;font-weight:700;margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ccard .sc{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.addc{border:2px dashed var(--line2);background:transparent;align-items:center;justify-content:center;min-height:250px;color:var(--muted);gap:10px;font-weight:600;text-align:center;padding:20px}
.addc:hover{color:var(--accent);border-color:var(--accent)}
.addc span{font-size:40px;line-height:1}
.skel .cv{background:linear-gradient(90deg,#14161b,#1c1f26,#14161b);background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
/* viewer */
#viewer{display:flex}
#side{width:380px;flex:none;border-inline-end:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
.sp{flex:1;overflow:auto;padding:18px 18px 10px;scrollbar-width:thin}
.sp-foot{border-top:1px solid var(--line);padding:12px 18px 14px;display:flex;flex-direction:column;gap:8px}
.sp-foot .row2{display:flex;gap:8px}
.sp-foot .row2 .btn{flex:1}
.back{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;margin-bottom:12px}
.back:hover{color:#fff}
.sp h1{font-size:21px;font-weight:700;line-height:1.4;margin:6px 0 4px}
.sp .price{font-size:24px;font-weight:700;color:var(--accent)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.spec{background:rgba(255,255,255,.04);border-radius:12px;padding:9px 12px}
.spec small{display:block;font-size:11px;color:var(--muted)}
.spec b{font-size:13.5px;font-weight:600}
.ptabs{display:flex;gap:2px;background:rgba(255,255,255,.04);padding:3px;border-radius:12px;margin-bottom:14px}
.ptabs button{flex:1;padding:8px 4px;border-radius:9px;font-size:12.5px;color:var(--muted);font-weight:500}
.ptabs button.on{background:rgba(255,255,255,.1);color:#fff}
.ptab{display:none}.ptab.on{display:block}
.desc{font-size:14px;line-height:1.9;color:#cfd4dc;white-space:pre-wrap}
.flist{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.fitem{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);font-size:13px;line-height:1.6;text-align:start;width:100%}
button.fitem:hover{background:rgba(255,255,255,.08)}
.fitem .d{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#111;margin-top:1px}
.fitem p{flex:1}
.fitem p small{display:block;color:var(--muted);font-size:12px}
.score{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.ring{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring div{width:62px;height:62px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:21px;font-weight:700}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
.fields3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fields3 .inp{text-align:center}
.verdict{padding:12px 14px;border-radius:12px;margin:12px 0;font-weight:600;font-size:14px}
.verdict.ok{background:rgba(72,187,120,.13);color:#9ae6b4}
.verdict.warn{background:rgba(246,173,85,.13);color:#fbd38d}
.verdict.bad{background:rgba(245,101,101,.13);color:#feb2b2}
.rows{display:flex;flex-direction:column;gap:6px}
.rw{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 11px;background:rgba(255,255,255,.04);border-radius:10px}
.rw b{direction:ltr;font-weight:600;white-space:nowrap}
.ok-t{color:#9ae6b4}.warn-t{color:#fbd38d}.bad-t{color:#feb2b2}
.gsvg{width:100%;background:rgba(255,255,255,.03);border-radius:12px;margin-top:4px}
.bigNum{font-size:28px;font-weight:700;color:var(--accent)}
/* stage */
#stage{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#1a1d24,#0b0c0f 70%);min-width:0;touch-action:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#spinCv{cursor:grab}#spinCv:active{cursor:grabbing}
#panoCv{cursor:grab}
#stage.adding canvas{cursor:crosshair}
#gal{position:absolute;inset:0;overflow:auto;padding:70px 20px 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;align-content:start}
#gal figure{border-radius:14px;overflow:hidden;background:var(--card);cursor:zoom-in}
#gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
#gal figcaption{font-size:12.5px;padding:8px 10px;color:#cfd4dc}
.stabs{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(16,18,23,.78);backdrop-filter:blur(14px);border:1px solid var(--line);z-index:6}
.stabs button{padding:7px 15px;border-radius:999px;font-size:13px;font-weight:500;color:#cfd4dc;white-space:nowrap}
.stabs button.on{background:#fff;color:#0b0c0f}
.stabs button:disabled{opacity:.35;cursor:default}
#hsLayer{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.hs{position:absolute;left:0;top:0;margin:-15px 0 0 -15px;width:30px;height:30px;border-radius:50%;pointer-events:auto;display:grid;place-items:center;border:2px solid #fff;font-size:15px;font-weight:700;line-height:1;transition:opacity .2s,background .2s;box-shadow:0 2px 12px rgba(0,0,0,.45)}
.hs.k-feat{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(6px)}
.hs.k-ok{background:var(--ok);color:#06210f}
.hs.k-minor{background:var(--warn);color:#2a1800}
.hs.k-major{background:var(--bad);color:#2a0606;font-size:12px}
.hs::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid rgba(255,255,255,.45);animation:pulse 2.2s infinite;pointer-events:none}
.hs.flash{animation:flash .9s 2}
@keyframes flash{50%{box-shadow:0 0 0 12px rgba(79,209,197,.35)}}
@keyframes pulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.5);opacity:0}}
.hs .tip{position:absolute;bottom:38px;white-space:nowrap;font-size:12px;font-weight:500;padding:4px 9px;border-radius:8px;background:rgba(0,0,0,.75);color:#fff;opacity:0;transition:.15s;pointer-events:none}
.hs:hover .tip{opacity:1}
.card{position:absolute;bottom:78px;left:50%;transform:translateX(-50%);width:min(460px,calc(100% - 28px));background:rgba(16,18,23,.88);backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:18px;padding:16px 18px;z-index:8;animation:up .3s}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.card h3{font-size:16px;margin-bottom:6px;padding-inline-end:24px}
.card p{font-size:13.5px;color:#cfd4dc;line-height:1.8}
.card .x{position:absolute;top:10px;inset-inline-end:12px;font-size:20px;color:var(--muted)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;margin-bottom:8px}
#caption p{font-size:15px;line-height:1.85;color:#fff}
#caption .bar{height:3px;background:rgba(255,255,255,.1);border-radius:3px;margin-top:12px;overflow:hidden}
#caption .bar i{display:block;height:100%;width:0;background:var(--accent)}
#caption .cf{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--muted);gap:6px;flex-wrap:wrap}
#caption .cf span:last-child{display:flex;gap:4px}
.sbar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:5px;border-radius:16px;background:rgba(16,18,23,.78);backdrop-filter:blur(14px);border:1px solid var(--line);z-index:6}
.sbar .btn{padding:8px 13px;font-size:13px}
.sbar .btn.on{color:var(--accent)}
#stLoad,#stEmpty{position:absolute;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none;color:var(--muted);font-size:14px;text-align:center;padding:30px;line-height:1.8}
#stEmpty b{display:block;color:#fff;font-size:17px;margin-bottom:4px}
#dragHint{position:absolute;top:62px;left:50%;transform:translateX(-50%);font-size:12.5px;color:#cfd4dc;background:rgba(0,0,0,.45);padding:5px 12px;border-radius:999px;z-index:5;pointer-events:none;transition:opacity .6s;white-space:nowrap}
#addHint{position:absolute;top:62px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:600;color:#2a1800;background:var(--warn);padding:7px 14px;border-radius:999px;z-index:7;white-space:nowrap}
.dial{position:absolute;bottom:22px;inset-inline-end:18px;width:44px;height:44px;z-index:5;pointer-events:none;opacity:.8}
/* editor */
.ed details{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:rgba(255,255,255,.02)}
.ed summary{padding:12px 14px;font-weight:600;font-size:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ed summary::-webkit-details-marker{display:none}
.ed summary em{font-style:normal;font-size:12px;color:var(--accent);font-weight:500}
.ed .dbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.upl{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:2px dashed var(--line2);border-radius:12px;font-size:13.5px;font-weight:600;color:#cfd4dc;cursor:pointer;text-align:center}
.upl:hover,.upl.drag{border-color:var(--accent);color:var(--accent)}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.thumbs{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.thumbs button{flex:none;width:52px;height:38px;border-radius:7px;background:#000 center/cover;border:2px solid transparent;position:relative}
.thumbs button i{position:absolute;bottom:1px;inset-inline-end:3px;font-size:9.5px;font-style:normal;text-shadow:0 0 3px #000}
.glist{display:flex;flex-direction:column;gap:8px}
.gitem{display:flex;gap:8px;align-items:center}
.gitem img{width:58px;height:44px;object-fit:cover;border-radius:8px;flex:none}
.gitem .inp{padding:7px 9px;font-size:13px}
.busy{font-size:12.5px;color:var(--accent);display:flex;align-items:center;gap:8px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:rot 1s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.seg{display:flex;background:rgba(255,255,255,.04);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;padding:7px 6px;border-radius:8px;font-size:12.5px;color:#c8cdd6;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button.on{background:rgba(255,255,255,.12);color:#fff}
.seg i{width:10px;height:10px;border-radius:50%;display:inline-block}
/* guided capture */
#cap{position:fixed;inset:0;z-index:55;background:#000;display:flex;flex-direction:column;color:#fff}
.capTop{display:flex;align-items:center;gap:12px;padding:10px 14px}
.capTop b{font-size:16px;display:block}.capTop small{font-size:12px;color:var(--muted)}
.capTop .x{margin-inline-start:auto;font-size:26px;color:#fff;width:40px;height:40px}
#capMap{width:64px;height:64px;flex:none}
.capStage{flex:1;display:flex;align-items:center;justify-content:center;padding:0 10px;min-height:0}
.capFrame{position:relative;aspect-ratio:16/9;width:min(100%,calc((100vh - 290px)*16/9));background:#111;border-radius:14px;overflow:hidden}
.capFrame video,.capFrame img,.capFrame canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#capFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.capHint{text-align:center;font-size:13px;color:#cfd4dc;padding:10px 16px 0;line-height:1.6}
.capBar{display:flex;align-items:center;justify-content:center;gap:26px;padding:14px 16px 8px}
.shutter{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.18);flex:none}
.shutter:active{background:#fff}
.capBar .btn{min-width:96px}
.capBar2{display:flex;justify-content:center;padding:4px 16px 16px}
.capPrev{display:flex;gap:4px;justify-content:center;padding:6px 10px 0;flex-wrap:wrap}
.capPrev i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18)}
.capPrev i.d{background:var(--accent)}.capPrev i.c{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.vidbox video{width:100%;border-radius:10px;background:#000;max-height:220px}
input[type=range]{width:100%;accent-color:var(--accent)}
/* dialog / lightbox / toast */
#dlg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#dlg .box{width:min(440px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:20px;background:#15171c;border:1px solid var(--line2)}
#dlg h3{font-size:17px;margin-bottom:14px}
#dlg .body{display:flex;flex-direction:column;gap:12px}
#dlg .acts{display:flex;gap:8px;margin-top:18px}
#dlg .acts .btn{flex:1}
#lb{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px}
#lb img{max-width:100%;max-height:80vh;border-radius:10px}
#lb p{color:#cfd4dc;font-size:14px}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;color:#fff;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1)}
#lbPrev{inset-inline-start:16px}#lbNext{inset-inline-end:16px}
#lb .x{position:absolute;top:16px;inset-inline-end:18px;font-size:28px;color:#fff}
#toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:60;padding:10px 18px;border-radius:999px;font-size:13.5px;background:#1d2027;border:1px solid var(--line2);opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (max-width:860px){
  body{overflow:auto}
  #hdr{padding:0 12px;gap:8px}
  #brand small{display:none}
  .hact .btn{padding:8px 10px;font-size:12.5px}
  .hact .btn .lbl{display:none}
  #viewer{flex-direction:column;overflow:auto}
  #stage{flex:none;height:58vh;order:-1}
  #side{width:auto;border:0;flex:none}
  .sp{overflow:visible}
  .stabs{top:10px}.stabs button{padding:6px 11px;font-size:12px}
  .sbar{bottom:10px}.sbar .btn{padding:7px 10px;font-size:12px}
  .card{bottom:64px}
  #dragHint,#addHint{top:54px}
  .dial{display:none}
}
</style>
</head>
<body>
<header id="hdr">
  <a id="brand" href="#"><span class="logo">360</span><span style="min-width:0"><b id="dealerName"></b><small data-i="brandSub"></small></span></a>
  <div class="hact">
    <select class="inp" id="lang" aria-label="Language"></select>
    <button class="btn hidden" id="btnSettings">⚙<span class="lbl" data-i="settings"></span></button>
    <button class="btn pri hidden" id="btnNew">＋<span class="lbl" data-i="addCar"></span></button>
  </div>
</header>
<div id="banner" class="hidden"></div>

<main id="home" class="view">
  <div class="hero">
    <h1 data-i="heroH"></h1>
    <p data-i="heroP"></p>
    <div class="hbar"><input class="inp" id="q" data-ph="searchPh"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<main id="viewer" class="view hidden">
  <aside id="side"></aside>
  <section id="stage">
    <div class="stabs" id="stabs">
      <button data-v="ext" data-i="tabExt"></button>
      <button data-v="int" data-i="tabInt"></button>
      <button data-v="gal"></button>

/* ----- hotspots ----- */
function buildHotspots(c){
  const L=$('#hsLayer');L.innerHTML='';hsEls=[];
  (c.hs||[]).forEach((h,i)=>{
    const k=KC[h.k]||KC.feat;const b=document.createElement('button');
    b.className='hs k-'+(KC[h.k]?h.k:'feat');b.innerHTML=`${k.i}<span class="tip">${esc(h.t||kindName(h.k))}</span>`;
    b.onclick=e=>{e.stopPropagation();stopTour();showHsCard(i);};
    L.appendChild(b);hsEls.push({h,el:b,i});
  });
}
const pv=T?new T.Vector3():null;
function placeHotspots(){
  const fi=frameIdx(),tol=spin.n>=12?1:0,c=car();
  for(const o of hsEls){
    const h=o.h,el=o.el;let show=false,x=0,y=0,op=1;
    if(hsOn||editing){
      if(h.v==='ext'&&view==='ext'&&spin.n&&spin.rect.w){const d=Math.abs(circ(fi-h.f,spin.n));
        if(d<=tol){show=true;op=d===0?1:.45;x=spin.rect.x+h.x*spin.rect.w;y=spin.rect.y+h.y*spin.rect.h;}}
      else if(h.v==='int'&&view==='int'&&pano.ready&&c&&c.pano){pv.copy(dirOf(h.yaw,h.pitch)).multiplyScalar(10).project(pano.cam);
        if(pv.z<1&&Math.abs(pv.x)<1.05&&Math.abs(pv.y)<1.05){show=true;x=(pv.x+1)/2*pano.cv.clientWidth;y=(1-pv.y)/2*pano.cv.clientHeight;}}
    }
    if(!show){if(el.style.display!=='none')el.style.display='none';continue;}
    el.style.display='';el.style.opacity=op;el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
  }
}
function showHsCard(i){
  const c=car(),h=(c.hs||[])[i];if(!h)return;const k=KC[h.k]||KC.feat;
  const card=$('#hsCard');
  card.innerHTML=`<button class="x">×</button>${h.k&&h.k!=='feat'&&KC[h.k]?`<span class="chip" style="background:${k.c}22;color:${k.c}">${kindName(h.k)}</span>`:''}<h3>${esc(h.t||kindName(h.k))}</h3>${h.d?`<p>${esc(h.d)}</p>`:''}${editing?`<div style="display:flex;gap:6px;margin-top:12px"><button class="btn sm" data-a="edit">${t('editBtn')}</button><button class="btn sm danger" data-a="del">${t('delPoint')}</button></div>`:''}`;
  card.classList.remove('hidden');card.querySelector('.x').onclick=hideHsCard;
  if(editing){card.querySelector('[data-a=del]').onclick=()=>{draft.hs.splice(i,1);buildHotspots(draft);renderEditor();hideHsCard();};
    card.querySelector('[data-a=edit]').onclick=()=>hsDialog(h,()=>{buildHotspots(draft);renderEditor();showHsCard(i);});}
}
function hideHsCard(){$('#hsCard').classList.add('hidden');}
function focusHs(i){
  const c=car(),h=(c.hs||[])[i];if(!h)return;stopTour();
  if(h.v==='ext'){if(view!=='ext')setView('ext',true);spinToFrame(h.f,900);spin.zoom=1;spin.px=spin.py=0;}
  else{if(view!=='int')setView('int',true);pano.gy=pano.yaw+circ2(h.yaw-pano.yaw);pano.gp=h.pitch;}
  flash(i);showHsCard(i);
  if(innerWidth<860)stage.scrollIntoView({behavior:'smooth'});

function flash(i){const o=hsEls.find(o=>o.i===i);if(o){o.el.classList.remove('flash');void o.el.offsetWidth;o.el.classList.add('flash');}}

/* ----- pointer input ----- */
const P=new Map();let moved=0,pinch=0,lastInteract=0;
function pdown(e){if(e.button>0)return;e.currentTarget.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;spin.vel=0;spin.anim=null;lastInteract=performance.now();$('#dragHint').style.opacity=0;}
function pmove(e){
  const p=P.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);lastInteract=performance.now();
  if(moved>6&&tour.on)stopTour();
  if(P.size===1){
    if(view==='ext'){
      if(spin.zoom>1.02){spin.px+=dx;spin.py+=dy;clampPan();}
      else if(spin.n>1){const k=spin.n/(Math.max(spin.cw,300)*.9);spin.cur-=dx*k;spin.vel=-dx*k;}
    }else if(view==='int'){const f=pano.fov/75;pano.gy-=dx*.0045*f;pano.gp=clamp(pano.gp+dy*.0045*f,-1.4,1.4);}
  }else if(P.size===2){
    const [a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch){const f=d/pinch;if(view==='ext')zoomAt(spin.zoom*f,(a.x+b.x)/2,(a.y+b.y)/2);else pano.gfov=clamp(pano.gfov/f,30,95);}
    pinch=d;
  }
}
function pup(e){if(!P.has(e.pointerId))return;P.delete(e.pointerId);if(P.size<2)pinch=0;if(e.type==='pointerup'&&moved<6)stageClick(e);}
[spin.cv,pano.cv].forEach(cv=>{cv.addEventListener('pointerdown',pdown);cv.addEventListener('pointermove',pmove);cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
  cv.addEventListener('wheel',e=>{e.preventDefault();lastInteract=performance.now();
    if(view==='ext')zoomAt(spin.zoom*(1-e.deltaY*.0015),e.clientX,e.clientY);else pano.gfov=clamp(pano.gfov*(1+e.deltaY*.001),30,95);},{passive:false});});
spin.cv.addEventListener('dblclick',e=>zoomAt(spin.zoom>1.2?1:2.4,e.clientX,e.clientY));
function stageClick(e){
  if(!adding){hideHsCard();return;}
  const r=e.currentTarget.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let h=null;
  if(adding==='ext'&&view==='ext'&&spin.n){
    const x=(mx-spin.rect.x)/spin.rect.w,y=(my-spin.rect.y)/spin.rect.h;if(x<0||x>1||y<0||y>1)return toast(t('tClickCar'));
    h={v:'ext',f:frameIdx(),x:+x.toFixed(4),y:+y.toFixed(4)};
  }else if(adding==='int'&&view==='int'&&car().pano){
    const nd=new T.Vector2(mx/r.width*2-1,-(my/r.height)*2+1),rc=new T.Raycaster();rc.setFromCamera(nd,pano.cam);
    const d=rc.ray.direction;h={v:'int',yaw:+Math.atan2(d.z,d.x).toFixed(4),pitch:+Math.asin(clamp(d.y,-1,1)).toFixed(4)};
  }
  if(!h)return;
  Object.assign(h,{k:'feat',t:'',d:''});
  hsDialog(h,()=>{draft.hs.push(h);buildHotspots(draft);renderEditor();cancelAdd();showHsCard(draft.hs.length-1);},true);
}
function hsDialog(h,done,isNew){
  dialog({title:isNew?t('hsNew'):t('hsEdit'),
    html:`<label class="f">${t('hsTitle')}<input class="inp" id="ht" maxlength="80" placeholder="${esc(t('hsTitlePh'))}" value="${esc(h.t)}"></label>
      <label class="f">${t('hsDesc')}<textarea class="inp" id="hd" maxlength="500" placeholder="${esc(t('hsDescPh'))}">${esc(h.d)}</textarea></label>`,
    onOk:dd=>{const v=dd.querySelector('#ht').value.trim();if(!v){dd.querySelector('#ht').focus();return false;}h.t=v;h.d=dd.querySelector('#hd').value.trim();h.k=h.k||'feat';done();}});
}
function startAdd(v){
  if(v==='ext'&&!(draft.spin||[]).length)return toast(t('tSpinFirst'));
  if(v==='int'&&!draft.pano)return toast(t('tPanoFirst'));
  adding=v;setView(v);stage.classList.add('adding');$('#addHint').classList.remove('hidden');

/* ================= guided tour ================= */
const tour={on:false,steps:[],i:-1,timer:0,t0:0,dur:0};let voice=false;
function buildSteps(c){
  const st=[],n=(c.spin||[]).length,hs=(c.hs||[]).map((h,i)=>Object.assign({_i:i},h));
  const intro=t('tourIntro',carTitle(c));
  if(n>1)st.push({v:'ext',full:true,text:intro,dur:6500});else st.push({v:c.pano?'int':'ext',text:intro,dur:5000});
  if(n>1)hs.filter(h=>h.v==='ext').sort((a,b)=>a.f-b.f).forEach(h=>st.push({v:'ext',hs:h,text:h.t+(h.d?'. '+h.d:''),dur:6500}));
  if(c.pano&&pano.ready){
    st.push({v:'int',yaw:c.pano.yaw0||0,pitch:c.pano.pitch0||0,text:t('tourInside'),dur:4500});
    hs.filter(h=>h.v==='int').forEach(h=>st.push({v:'int',hs:h,text:h.t+(h.d?'. '+h.d:''),dur:6500}));
  }
  st.push({v:n>1?'ext':c.pano?'int':'ext',end:true,text:t('tourEnd'),dur:5000});
  return st;
}
function startTour(){const c=car();if(!c)return;cancelAdd();hideHsCard();tour.steps=buildSteps(c);tour.on=true;tour.i=-1;$('#caption').classList.remove('hidden');$('#btnTour').textContent=t('stopTour');nextStep();}
function nextStep(){
  clearTimeout(tour.timer);tour.i++;
  if(tour.i>=tour.steps.length){stopTour();return;}
  const s=tour.steps[tour.i];
  if(view!==s.v)setView(s.v,true);
  spin.zoom=1;spin.px=spin.py=0;
  if(s.full&&spin.n)spinTo(spin.cur+spin.n,s.dur*.9);
  if(s.hs){if(s.hs.v==='ext')spinToFrame(s.hs.f,1600);else{pano.gy=pano.yaw+circ2(s.hs.yaw-pano.yaw);pano.gp=s.hs.pitch;}setTimeout(()=>flash(s.hs._i),900);}
  if(s.yaw!==undefined){pano.gy=pano.yaw+circ2(s.yaw-pano.yaw);pano.gp=s.pitch;}
  if(s.end&&spin.n&&s.v==='ext')spinToFrame(0,1500);
  $('#caption p').textContent=s.text;$('#capStep').textContent=`${tour.i+1} / ${tour.steps.length}`;
  speak(s.text);tour.t0=performance.now();tour.dur=s.dur;tour.timer=setTimeout(nextStep,s.dur);
}
function stopTour(){if(!tour.on)return;clearTimeout(tour.timer);tour.on=false;$('#caption').classList.add('hidden');$('#btnTour').textContent=t('tour');try{speechSynthesis.cancel();}catch(e){}}
function speak(txt){if(!voice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=lang==='ar'?'ar-SA':lang;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
$('#btnTour').onclick=()=>tour.on?stopTour():startTour();
$('#capNext').onclick=nextStep;$('#capStop').onclick=stopTour;
$('#capVoice').onclick=()=>{voice=!voice;$('#capVoice').textContent=voice?t('voiceOn'):t('voiceOff');if(voice&&tour.on)speak(tour.steps[tour.i].text);else try{speechSynthesis.cancel();}catch(e){}};

/* ----- uploads ----- */
async function shrink(file,maxW){
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:'from-image'});}
  catch(e){src=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file);});}
  const w=src.width,h=src.height,s=Math.min(1,maxW/w);
  if(s===1&&file.type==='image/jpeg'&&file.size<3e6)return file;
  const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',.86));
}
async function storeImage(file,maxW){
  const blob=await shrink(file,maxW);
  if(S.assets){const r=await S.assets.upload(blob);return{id:r.id};}
  return{src:URL.createObjectURL(blob)};
}
async function uploadMany(files,maxW,label,keepOrder){
  let arr=[...files].filter(f=>/^image\//.test(f.type));
  if(!keepOrder)arr.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  if(!arr.length){toast(t('tNoPhotos'));return[];}
  const out=new Array(arr.length);let i=0,done=0,fail=0;setBusy(`${label} 0/${arr.length}`);
  const worker=async()=>{while(i<arr.length){const k=i++;try{out[k]=await storeImage(arr[k],maxW);}catch(e){fail++;console.warn(e);}done++;setBusy(`${label} ${done}/${arr.length}`);}};
  await Promise.all([worker(),worker(),worker()]);setBusy(null);
  if(fail)toast(t('tFail',fail));
  return out.filter(Boolean);
}
async function addSpin(files,keepOrder){
  const add=await uploadMany(files,1600,t('upSpin'),keepOrder);if(!add.length||!editing)return;
  draft.spin=(draft.spin||[]).concat(add);spinLoad(draft.spin,true);setView('ext');refreshTabs();renderEditor();

async function addPano(file){

function silGroup(type){
  if(sil.groups[type])return sil.groups[type];
  const P=PROF[type]||PROF.sedan,sh=new T.Shape(),pts=P.pts,yb=.3,ar=P.r+.09;
  sh.moveTo(pts[0][0],yb);pts.forEach(q=>sh.lineTo(q[0],q[1]));
  const fx=pts[pts.length-1][0];sh.lineTo(fx,yb);
  sh.lineTo(P.wf+ar,yb);sh.absarc(P.wf,P.r,ar,0,Math.PI,false);
  sh.lineTo(P.wr+ar,yb);sh.absarc(P.wr,P.r,ar,0,Math.PI,false);
  sh.lineTo(pts[0][0],yb);
  const geo=new T.ExtrudeGeometry(sh,{depth:P.w-.16,bevelEnabled:true,bevelThickness:.08,bevelSize:.06,bevelSegments:4,curveSegments:24});
  geo.translate(0,0,-(P.w-.16)/2);
  const g=new T.Group(),mat=new T.MeshBasicMaterial({color:0xffffff});g.add(new T.Mesh(geo,mat));
  const wg=new T.CylinderGeometry(P.r,P.r,.26,40).rotateX(Math.PI/2);
  [[P.wf,1],[P.wf,-1],[P.wr,1],[P.wr,-1]].forEach(([x,sd])=>{const m=new T.Mesh(wg,mat);m.position.set(x,P.r,sd*(P.w/2-.14));g.add(m);});
  [-1,1].forEach(sd=>{const m=new T.Mesh(new T.BoxGeometry(.16,.09,.2),mat);const top=pts.reduce((a,q)=>q[0]>.6&&q[0]<1.3?Math.max(a,q[1]):a,0)||1;m.position.set(.85,Math.min(top,1.25)-.02,sd*(P.w/2+.06));g.add(m);});

function silOutline(th,type){
  const key=type+':'+cap.sl+':'+cap.sh+':'+th.toFixed(4);if(sil.cache[key])return sil.cache[key];
  Object.values(sil.groups).forEach(g=>g.visible=false);
  const grp=silGroup(type);grp.visible=true;grp.scale.set(cap.sl,cap.sh,1);
  const P=PROF[type]||PROF.sedan,hmax=Math.max(...P.pts.map(q=>q[1]));
  const tg=new T.Vector3(0,hmax*.5*cap.sh,0);sil.cam.position.setFromSpherical(new T.Spherical(10.4,1.3,th)).add(tg);sil.cam.lookAt(tg);
  sil.R.render(sil.scene,sil.cam);
  const W=640,H=360,mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c;};
  const mask=mk();mask.getContext('2d').drawImage(sil.R.domElement,0,0);
  const col=mk(),cx=col.getContext('2d');cx.drawImage(mask,0,0);cx.globalCompositeOperation='source-in';cx.fillStyle='#4fd1c5';cx.fillRect(0,0,W,H);
  const ring=mk(),g=ring.getContext('2d');
  for(let a=0;a<16;a++)g.drawImage(col,Math.cos(a/16*6.2832)*3.2,Math.sin(a/16*6.2832)*3.2);
  g.globalCompositeOperation='destination-out';g.drawImage(mask,0,0);
  const pc=document.createElement('canvas');pc.width=pc.height=9;const px=pc.getContext('2d');px.fillStyle='#fff';px.beginPath();px.arc(4.5,4.5,2.6,0,7);px.fill();
  g.globalCompositeOperation='destination-in';g.fillStyle=g.createPattern(pc,'repeat');g.fillRect(0,0,W,H);
  const out=mk(),o=out.getContext('2d');

}

async function generateDemo(){
  if(S.demo||S.demoBusy||!pano.ready)return;S.demoBusy=true;
  const tick=()=>new Promise(r=>setTimeout(r,0));
  try{
    const R=pano.R,scene=buildDemo();
    R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
    const prevPR=R.getPixelRatio();R.setPixelRatio(1);
    const W=1280,H=720,N=36,cam=new T.PerspectiveCamera(30,W/H,.1,200),tgt=new T.Vector3(0,.58,0),Rr=10.4,PHI=1.3;
    R.setSize(W,H,false);
    const frames=[],camPos=[];
    for(let i=0;i<N;i++){
      const th=.95+i*Math.PI*2/N;cam.position.setFromSpherical(new T.Spherical(Rr,PHI,th)).add(tgt);cam.lookAt(tgt);cam.updateMatrixWorld();
      R.render(scene,cam);frames.push({src:R.domElement.toDataURL('image/jpeg',.86)});camPos.push(cam.position.clone());
      if(i%4===3)await tick();
    }
    const EXT=[[[2.4,.76,.62],[1,.2,.4],'feat'],[[1.4,.36,1.0],[0,0,1],'feat'],[[.25,.62,1.0],[0,0,1],'feat'],[[2.42,.5,-.45],[1,0,-.25],'feat'],
      [[-1.4,.36,-1.0],[0,0,-1],'feat'],[[-1.95,.86,-1.0],[0,0,-1],'feat'],[[-2.44,.8,.3],[-1,0,.15],'feat']];
    const hs=[],v=new T.Vector3();
    EXT.forEach(([pp,nn,k],idx)=>{const p=new T.Vector3(...pp),n=new T.Vector3(...nn).normalize();let best=0,bd=-2;
      camPos.forEach((cp,i)=>{const d=cp.clone().sub(p).normalize().dot(n);if(d>bd){bd=d;best=i;}});
      const th=.95+best*Math.PI*2/N;cam.position.setFromSpherical(new T.Spherical(Rr,PHI,th)).add(tgt);cam.lookAt(tgt);cam.updateMatrixWorld();
      v.copy(p).project(cam);hs.push({v:'ext',f:best,x:+((v.x+1)/2).toFixed(4),y:+((1-v.y)/2).toFixed(4),k,n:idx});});
    hs.sort((a,b)=>a.f-b.f);
    const GW=1200,GH=900;R.setSize(GW,GH,false);const gc=new T.PerspectiveCamera(36,GW/GH,.05,200);const gal=[];
    [[.45,1.35,3.0,[1.4,.42,.8]],[1.3,1.3,4.0,[1.8,.65,0]],[-2.25,1.25,7.6,[0,.6,0]],[.6,.42,9,[0,.5,0]]].forEach(([th,ph,r,tt])=>{
      const tv=new T.Vector3(...tt);gc.position.setFromSpherical(new T.Spherical(r,ph,th)).add(tv);gc.lookAt(tv);R.render(scene,gc);gal.push(R.domElement.toDataURL('image/jpeg',.86));});
    await tick();
    const crt=new T.WebGLCubeRenderTarget(1024,{generateMipmaps:false});const cc=new T.CubeCamera(.02,100,crt);
    const DRV=new T.Vector3(-.42,1.2,-.38);cc.position.copy(DRV);scene.add(cc);cc.update(R,scene);
    [[[.36,1.11,0],'feat'],[[.13,1.02,-.38],'feat'],[[-.4,.95,.38],'feat'],[[-1.22,.95,0],'feat'],[[.36,.94,.6],'feat']].forEach(([pp,k],idx)=>{
      const d=new T.Vector3(...pp).sub(DRV).normalize();hs.push({v:'int',yaw:+Math.atan2(d.z,d.x).toFixed(4),pitch:+Math.asin(d.y).toFixed(4),k,n:idx});});
    R.shadowMap.enabled=false;R.toneMapping=T.NoToneMapping;R.toneMappingExposure=1;R.setPixelRatio(prevPR);panoResize();
    S.demoRaw={frames,gal,hs,pano:{cube:crt.texture,yaw0:0,pitch0:-.1}};localizeDemo();
  }catch(e){console.warn('demo failed',e);}

}

/* ================= capabilities / data ================= */
function updateHeader(){$('#btnSettings').classList.toggle('hidden',!S.editor);$('#btnNew').classList.toggle('hidden',!S.editor);}
function localMode(standalone){S.local=true;S.editor=true;S.loaded=true;S.assets=null;S.db=null;updateHeader();banner(standalone?'bannerStandalone':'bannerLocal');route();}
async function initCaps(){
  const cl=window.claude;
  if(!cl||typeof cl.use!=='function'){localMode(true);return;}
  let db=null,assets=null,user=null;
  try{[db,assets,user]=await Promise.all(['db','assets','user'].map(n=>cl.use(n).catch(()=>null)));}catch(e){}
  if(!db){localMode();return;}
  S.db=db;S.assets=assets;S.user=user;S.local=false;
  S.editor=user?!!(await user.canEdit()):false;updateHeader();
  const timer=setTimeout(()=>{if(!S.loaded)banner('bannerNet');},10000);
  db.collection('cars').onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);if(bannerKey==='bannerNet')banner(null);}
    S.cars=snap.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded=true;onData();
  },()=>{clearTimeout(timer);S.loaded=true;banner('bannerLoadFail');onData();});
  db.doc('meta/settings').onSnapshot(s=>{
    S.settings=Object.assign({},DEF,s.exists?s.data():{});
    if(!langChosen&&S.settings.lang&&I18N[S.settings.lang]&&S.settings.lang!==lang){lang=S.settings.lang;applyLang();}
    applySettings();onData(true);
  },()=>{});
}
function onData(force){
  if(editing)return;
  const h=location.hash.slice(1);
  if(!h||h==='home'){renderHome();return;}
  route(force);
}
applyLang();route();
setTimeout(initCaps,0);
setTimeout(generateDemo,120);
})();
